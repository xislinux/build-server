name: Build Minecraft Paper Server with sf

on:
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: 'xislinux/mcserver'
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Download Paper 1.21.5
        run: |
          mkdir -p server/plugins
          cd server
          curl -o paper.jar https://fill-data.papermc.io/v1/objects/2ae6ae22adf417699746e0f89fc2ef6cb6ee050a5f6608cee58f0535d60b509e/paper-1.21.5-114.jar
      
      - name: Download Slimefun4
        run: |
          cd server/plugins
          curl -L -o Slimefun4.jar https://blob.build/project/Slimefun4/RC
      
      - name: Setup server files
        run: |
          echo "eula=true" > server/eula.txt
          cat > server/server.properties << 'EOF'
          server-port=25565
          online-mode=false
          max-players=20
          level-name=world
          view-distance=10
          simulation-distance=10
          EOF
      
      - name: Generate world
        run: |
          cd server
          echo stop | java -Xmx2G -jar paper.jar nogui
          sleep 5
      
      - name: Remove world files only
        run: |
          cd server
          # Remove the world folder completely
          rm -rf world/
          rm -rf world_nether/
          rm -rf world_the_end/
          
          # Remove playerdata and stats if they exist elsewhere
          rm -rf playerdata/
          rm -rf stats/
          
          # Keep everything else!
          echo "Kept files:"
          ls -la
      
      - name: Clean up runtime files
        run: |
          cd server
          # Remove only runtime logs and cache
          rm -rf logs/
          rm -f *.log
          rm -f usercache.json
          # Keep paper.jar for users to run the server
          # Keep plugins folder with Slimefun
          # Keep server.properties and eula.txt
      
      - name: Create timestamped build folder
        run: |
          BUILD_DIR="server-build-$(date +'%Y%m%d-%H%M%S')"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
          mkdir -p "$BUILD_DIR"
          
          # Copy server files to build directory
          cp -r server/* "$BUILD_DIR/"
      
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      
      - name: Push to repository
        run: |
          # Make sure we're on main branch
          git checkout main 2>/dev/null || git checkout -b main
          git pull origin main --rebase || true
          
          # Create builds directory if it doesn't exist
          mkdir -p builds
          
          # Move build folder to builds directory
          mv ${{ env.BUILD_DIR }} builds/
          
          # Create latest.txt with the newest build folder name
          echo "${{ env.BUILD_DIR }}" > builds/latest.txt
          
          # Create a simple README for the builds folder
          cat > builds/README.md << 'EOF'
          # Minecraft Server Builds
          
          Each folder contains a complete Paper 1.21.5 server with Slimefun4.
          
          ## Latest Build
          Check `latest.txt` for the most recent build folder name.
          
          ## Usage
          1. Download/copy the latest build folder
          2. Run `java -jar paper.jar` to generate the world
          3. The world will be created fresh on first run
          
          ## Note
          World files are removed to save space. The server will generate a fresh world when first started.
          EOF
          
          # Keep only last 3 builds to save space (optional)
          cd builds
          ls -d server-build-*/ 2>/dev/null | sort -r | tail -n +4 | xargs -r rm -rf
          cd ..
          
          # Add and commit
          git add builds/ ${{ env.BUILD_DIR }}
          git commit -m "Add server build: ${{ env.BUILD_DIR }} [skip ci]" || echo "No changes to commit"
          
          # Push to main branch
          git push origin main
